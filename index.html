<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #musicArea {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="musicArea"></div>

  <audio id="music" src="test.mp3" loop></audio>

  <script>
    const musicArea = document.getElementById("musicArea");
    const music = document.getElementById("music");

    musicArea.addEventListener("click", function () {

      if (music.paused) {
        music.play()
          .then(() => {
            console.log("Music started!");
          })
          .catch(error => {
            console.error("Music failed:", error);
          });
      } else {
        music.pause();
      }

    });
  </script>

</body>
</html>
